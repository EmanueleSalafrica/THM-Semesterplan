<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GSAP Test - MPM Projekt Team 2</title>
    <link rel="stylesheet" href="CSS/style.css">
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
      }

      main {
        width: min(100%, 680px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        line-height: 1.5;
      }

      .testfläche {
        min-height: 220px;
        display: flex;
        align-items: center;
        margin: 24px 0;
        padding: 24px;
        overflow: hidden;
        border: 2px solid #d8e0ea;
        border-radius: 8px;
        background: #ffffff;
      }

      .box {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        background: #2f80ed;
        box-shadow: 0 12px 28px rgba(47, 128, 237, 0.28);
      }

      .status {
        padding: 12px 16px;
        border-radius: 8px;
        background: #e8f5ed;
        color: #166534;
        font-weight: 700;
      }

      .status.fehler {
        background: #fdecec;
        color: #991b1b;
      }

      button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #1f2933;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #2f80ed;
        outline-offset: 3px;
      }

      @media (min-width: 800px) {
        h1 {
          font-size: 2.5rem;
        }

        .box {
          width: 96px;
          height: 96px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GSAP Test</h1>
      <p>
        Diese Datei prüft, ob GSAP lokal aus dem Repository geladen wird.
        Wenn sich das Quadrat bewegt, ist die Einbindung erfolgreich.
      </p>

      <p id="status" class="status">GSAP wird geprüft...</p>

      <div class="testfläche" aria-label="Animationsfläche">
        <div class="box" aria-hidden="true"></div>
      </div>

      <button type="button" id="restart">Animation nochmal starten</button>
    </main>

    <script src="JS/lib/gsap/gsap.min.js"></script>
    <script>
      const statusElement = document.querySelector("#status");
      const box = document.querySelector(".box");
      const restartButton = document.querySelector("#restart");

      function starteAnimation() {
        gsap.fromTo(
          box,
          { x: 0, rotate: 0, scale: 1 },
          {
            x: "min(420px, calc(100vw - 180px))",
            rotate: 360,
            scale: 1.08,
            duration: 1.4,
            ease: "power2.inOut",
            yoyo: true,
            repeat: 1
          }
        );
      }

      if (window.gsap) {
        statusElement.textContent = `GSAP ist lokal eingebunden. Version: ${gsap.version}`;
        console.log("GSAP Version:", gsap.version);
        starteAnimation();
        restartButton.addEventListener("click", starteAnimation);
      } else {
        statusElement.textContent = "GSAP konnte nicht geladen werden.";
        statusElement.classList.add("fehler");
        restartButton.disabled = true;
      }
    </script>
  </body>
</html>
