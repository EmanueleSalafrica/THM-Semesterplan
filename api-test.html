<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CurrGen API Test - MPM Projekt Team 2</title>
    <link rel="stylesheet" href="CSS/style.css">
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
      }

      main {
        width: min(100%, 820px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }

      button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #1f2933;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .status {
        margin-top: 24px;
        padding: 16px;
        border-radius: 8px;
        background: #e8f5ed;
        color: #166534;
        font-weight: 700;
      }

      .status.fehler {
        background: #fdecec;
        color: #991b1b;
      }

      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CurrGen API Test</h1>
      <p>
        Diese Seite sendet eine echte Studienplan-Anfrage an die CurrGen-API.
        Die Antwort wird in der Browser-Konsole ausgegeben.
      </p>
      <p>
        Endpoint:
        <code>https://turing.iem.thm.de/currgen/api/v1/generate-schedule</code>
      </p>

      <form id="api-form">
        <label>
          Geschwindigkeit
          <select name="geschwindigkeit">
            <option value="100">100 Prozent</option>
            <option value="90">90 Prozent</option>
            <option value="80">80 Prozent</option>
            <option value="70">70 Prozent</option>
            <option value="60">60 Prozent</option>
            <option value="50">50 Prozent</option>
          </select>
        </label>

        <label>
          Schwerpunkt
          <select name="schwerpunkt">
            <option value="WM">Web &amp; Mobile</option>
            <option value="MP">Medienproduktion</option>
          </select>
        </label>

        <label>
          Start-Jahreszeit
          <select name="startJahreszeit">
            <option value="W">Wintersemester</option>
            <option value="S">Sommersemester</option>
          </select>
        </label>

        <label>
          Vorhandene Module, kommasepariert
          <input name="vorhandeneModule" value="1, 4, 5" inputmode="numeric">
        </label>

        <label>
          Ausgeschlossene Module, kommasepariert
          <input name="ausgeschlosseneModule" value="12" inputmode="numeric">
        </label>

        <label>
          Maximale Anzahl Lösungen
          <input name="maxAnzahlLoesungen" type="number" min="1" max="100" value="2">
        </label>

        <button type="submit">Studienplan generieren</button>
      </form>

      <p id="status" class="status">Bereit für die CurrGen-API-Abfrage.</p>
    </main>

    <script src="JS/api-client.js"></script>
    <script>
      const form = document.querySelector("#api-form");
      const statusElement = document.querySelector("#status");

      function formularAlsParameter() {
        const formData = new FormData(form);

        return {
          geschwindigkeit: formData.get("geschwindigkeit"),
          schwerpunkt: formData.get("schwerpunkt"),
          startJahreszeit: formData.get("startJahreszeit"),
          vorhandeneModule: formData.get("vorhandeneModule"),
          ausgeschlosseneModule: formData.get("ausgeschlosseneModule"),
          maxAnzahlLoesungen: formData.get("maxAnzahlLoesungen")
        };
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusElement.classList.remove("fehler");
        statusElement.textContent = "CurrGen-API-Abfrage läuft...";

        try {
          const daten = await window.MPMProjekt.api.generiereStudienplan(formularAlsParameter());
          const ersteLoesung = daten.loesungen?.[0];

          statusElement.textContent = `Studienplan generiert: ${daten.anzahlGelieferterLoesungen} Lösung(en), Penalty ${daten.penalty}. Details stehen in der Browser-Konsole.`;
          console.log("[MPM] CurrGen Request:", daten.request);
          console.log("[MPM] CurrGen Response:", daten);
          console.log("[MPM] Erste Lösung:", ersteLoesung);
        } catch (fehler) {
          statusElement.textContent = "CurrGen-API-Abfrage fehlgeschlagen. Details stehen in der Browser-Konsole.";
          statusElement.classList.add("fehler");
          console.error("[MPM] Fehler bei der CurrGen-API-Abfrage:", fehler);
          console.info("[MPM] Hinweis: Wenn der Browser die Anfrage wegen CORS blockiert, muss die Anwendung später über eine freigegebene Herkunft oder einen Backend-Proxy angebunden werden.");
        }
      });
    </script>
  </body>
</html>
