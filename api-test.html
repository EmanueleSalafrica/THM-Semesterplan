<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Test - MPM Projekt Team 2</title>
    <link rel="stylesheet" href="CSS/style.css">
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
      }

      main {
        width: min(100%, 760px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      label {
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }

      button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #1f2933;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .status {
        margin-top: 24px;
        padding: 16px;
        border-radius: 8px;
        background: #e8f5ed;
        color: #166534;
        font-weight: 700;
      }

      .status.fehler {
        background: #fdecec;
        color: #991b1b;
      }

      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>API Test</h1>
      <p>
        Diese Seite startet eine API-Abfrage mit <code>fetch</code>.
        Die Antwort wird in der Browser-Konsole ausgegeben.
      </p>

      <form id="api-form">
        <label for="api-url">API-URL</label>
        <input
          id="api-url"
          name="api-url"
          type="url"
          value="https://jsonplaceholder.typicode.com/todos/1"
          required
        >
        <button type="submit">API-Abfrage starten</button>
      </form>

      <p id="status" class="status">Bereit für die API-Abfrage.</p>
    </main>

    <script src="JS/api-client.js"></script>
    <script>
      const form = document.querySelector("#api-form");
      const urlInput = document.querySelector("#api-url");
      const statusElement = document.querySelector("#status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusElement.classList.remove("fehler");
        statusElement.textContent = "API-Abfrage läuft...";

        try {
          const daten = await window.MPMProjekt.api.starteApiAbfrage(urlInput.value);
          statusElement.textContent = "API-Abfrage erfolgreich. Ergebnis steht in der Browser-Konsole.";
          console.log("[MPM] Ergebnis der Testabfrage:", daten);
        } catch (fehler) {
          statusElement.textContent = "API-Abfrage fehlgeschlagen. Details stehen in der Browser-Konsole.";
          statusElement.classList.add("fehler");
          console.error("[MPM] Fehler bei der API-Testabfrage:", fehler);
        }
      });
    </script>
  </body>
</html>
